[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "robot-debug-lab"
version = "0.1.0"
description = "Evidence-driven multi-agent debugging for ROS 2 simulation"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
include = ["robot_debug_lab*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
